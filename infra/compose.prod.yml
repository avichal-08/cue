name: cue-prod

x-app: &app
  restart: unless-stopped
  env_file: ../.env
  depends_on:
    redis:
      condition: service_healthy
    minio-init:
      condition: service_completed_successfully

x-internal: &internal
  REDIS_URL: redis://redis:6379
  S3_ENDPOINT: http://minio:9000

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes', '--maxmemory-policy', 'noeviction']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      retries: 10

  minio:
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - minio-data:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 5s
      retries: 10

  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY}:${S3_SECRET_KEY}@minio:9000
    command: ['mb', '--ignore-existing', 'local/${S3_BUCKET}']

  api:
    <<: *app
    build:
      context: ..
      target: api
    environment:
      <<: *internal
      S3_PUBLIC_ENDPOINT: ${PUBLIC_URL}
      WEB_ORIGIN: ${PUBLIC_URL}
      API_PORT: 4000

  worker:
    <<: *app
    build:
      context: ..
      target: worker
    environment:
      <<: *internal
      YTDLP_PATH: /usr/local/bin/yt-dlp

  web:
    restart: unless-stopped
    build:
      context: ..
      target: web

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on: [api, web, minio]
    ports:
      - '80:80'
      - '443:443'
    environment:
      CADDY_ADDRESS: ${CADDY_ADDRESS:-${PUBLIC_URL}}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  redis-data:
  minio-data:
  caddy-data:
  caddy-config:
